<!DOCTYPE html>
<html lang="__LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<meta name="description" content="__DESC__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&family=Noto+Sans+JP:wght@500;700;900&family=Noto+Serif+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--W:__W__px;--H:__H__px;--ink:#1d2a44;--coral:#e8573f;--gold:#f4b63a;--cream:#fffaf0;--sky:#3d7be0;--mint:#2fa877;
--fs:__FS__px;--sx:__SX__px;--sb:__SB__px;--st:__ST__px;--sr:__SR__px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#f3efe6;font-family:"Noto Sans KR","Noto Sans JP","Noto Sans CJK KR","Noto Sans CJK JP",sans-serif;color:var(--ink)}
body.view{display:flex;flex-direction:column;align-items:center;min-height:100vh}
#wrap{position:relative;width:var(--W);height:var(--H);overflow:hidden;transform-origin:0 0;background:#fff}
body.view #holder{position:relative}
.bg{position:absolute;inset:-2%;background-size:cover;background-position:center;opacity:0;transition:opacity 1.2s ease;filter:brightness(1.12) saturate(1.08)}
.bg.on{opacity:1}
body.play .bg.on{animation:kb 22s ease-in-out infinite alternate}
@keyframes kb{from{transform:scale(1.0) translate(0,0)}to{transform:scale(1.08) translate(-1.2%,-1%)}}
video.bg{object-fit:cover;width:104%;height:104%}
.veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,250,240,0) 35%,rgba(255,250,240,.55) 62%,rgba(255,250,240,.92) 100%)}
.top{position:absolute;left:var(--sx);top:var(--st);right:var(--sr);display:flex;gap:calc(var(--fs)*.25);align-items:center;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.94);border-radius:999px;padding:calc(var(--fs)*.16) calc(var(--fs)*.42);font-weight:900;font-size:calc(var(--fs)*.46);box-shadow:0 6px 24px rgba(0,0,0,.12)}
.chip.brand{background:var(--ink);color:#fff;letter-spacing:.04em}
.chip.stage{color:#fff}
.stage.hook,.stage.intro{background:var(--sky)}.stage.goguma{background:#8a5a3c}.stage.turning{background:var(--gold);color:var(--ink)!important}
.stage.saida,.stage.ending{background:var(--mint)}
.meter{position:absolute;right:var(--sr);top:var(--st);width:calc(var(--fs)*4.2);background:rgba(255,255,255,.94);border-radius:calc(var(--fs)*.3);padding:calc(var(--fs)*.18) calc(var(--fs)*.26);font-size:calc(var(--fs)*.34);font-weight:900;box-shadow:0 6px 24px rgba(0,0,0,.12)}
.meter .bar{height:calc(var(--fs)*.22);border-radius:99px;background:#e9e2d6;margin-top:calc(var(--fs)*.1);overflow:hidden}
.meter .bar i{display:block;height:100%;background:linear-gradient(90deg,#8a5a3c,var(--gold),var(--mint));transition:width 1s}
.cap{position:absolute;left:var(--sx);right:var(--sr);bottom:var(--sb);background:rgba(255,255,255,.96);border-radius:calc(var(--fs)*.4);padding:calc(var(--fs)*.42) calc(var(--fs)*.6);box-shadow:0 18px 60px rgba(29,42,68,.18);border-left:calc(var(--fs)*.14) solid var(--coral)}
.cap .t{font-size:var(--fs);line-height:1.38;font-weight:700;word-break:keep-all;letter-spacing:-.01em}
.cap .t q{quotes:none;color:var(--coral);font-weight:900}
.cap .t.en{word-break:normal;line-height:1.3}
.scene-title{font-size:calc(var(--fs)*.42);font-weight:900;color:var(--coral);margin-bottom:calc(var(--fs)*.12)}
.ui{display:none}
html[lang=ja] .cap .t,html[lang=ja] .th-q,html[lang=ja] .chip{word-break:normal!important;line-break:strict;overflow-wrap:anywhere}
html.r,body.render,html:has(body.render){overflow:hidden}body.render .credits,body.render .ui{display:none!important}
#wrap.portrait .meter{top:calc(var(--st) + var(--fs)*1.05);right:auto;left:var(--sx)}
body.view .ui{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;padding:14px;font-size:18px}
.ui button{font-size:22px;font-weight:900;padding:12px 26px;border-radius:999px;border:0;background:var(--coral);color:#fff;cursor:pointer}
.ui select,.ui input{font-size:18px}
.credits{font-size:13px;color:#6b6b6b;max-width:900px;padding:8px 16px 30px;line-height:1.6}
/* thumbnail */
#thumb{position:absolute;inset:0;display:none}
#thumb.on{display:block}
#thumb .bg{opacity:1;filter:brightness(1.15)}
.th-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,250,240,.92) 0%,rgba(255,250,240,.6) 45%,rgba(255,250,240,0) 70%)}
.th-big{position:absolute;font-family:"Noto Serif KR","Noto Sans JP",serif;font-weight:900;color:var(--ink);line-height:1.02;letter-spacing:-.03em}
.th-big b{color:var(--coral);display:inline-block;background:var(--gold);padding:0 .12em;border-radius:.1em;transform:rotate(-2deg)}
.th-badge{position:absolute;background:var(--coral);color:#fff;font-weight:900;border-radius:.3em;padding:.12em .45em;box-shadow:0 10px 40px rgba(232,87,63,.4)}
.th-q{position:absolute;background:#fff;border-radius:.5em;padding:.4em .6em;font-weight:900;box-shadow:0 14px 50px rgba(0,0,0,.18);line-height:1.25;word-break:keep-all}
.th-q small{display:block;font-size:.55em;color:#7a6a5a;margin-bottom:.2em}
.th-q.villain{border-left:.25em solid #8a5a3c}.th-q.hero{border-left:.25em solid var(--mint)}
.th-tag{position:absolute;background:var(--ink);color:#fff;font-weight:900;border-radius:999px;padding:.2em .7em}
</style>
</head>
<body class="__MODE__">
<div id="holder"><div id="wrap" class="__ORIENT__">
  <div id="bgs"></div>
  <div class="veil"></div>
  <div class="top"><span class="chip brand">__BRAND__</span><span class="chip stage" id="stage"></span><span class="chip" id="stitle"></span></div>
  <div class="meter" id="meter"><span id="mlabel"></span><div class="bar"><i id="mbar"></i></div></div>
  <div class="cap"><div class="t" id="cap"></div></div>
  <div id="thumb">__THUMB__</div>
</div></div>
<div class="ui"><button id="play">▶ __PLAYLABEL__</button><select id="speed"><option value="1">1.0x</option><option value="1.15">1.15x</option><option value="0.9">0.9x</option></select><span id="clock">0:00</span></div>
<div class="credits ui" style="display:block">__CREDITS__</div>
<audio id="aud" preload="metadata" src="__AUDIO__"></audio>
<script>
const D=__DATA__;
const wrap=document.getElementById('wrap'),bgs=document.getElementById('bgs');
const STL=D.stageLabels, METER=D.meter;
const layers={};
function bgEl(key){
  if(layers[key])return layers[key];
  let el;
  if(D.mode==='play' && D.videos[key]){el=document.createElement('video');el.src=D.videos[key];el.muted=true;el.loop=true;el.playsInline=true;}
  else{el=document.createElement('div');el.style.backgroundImage=`url("${D.images[key]}")`;}
  el.className='bg';bgs.appendChild(el);layers[key]=el;return el;
}
function fmtCap(t){return t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(/["“「]([^"”」]+)["”」]/g,(m,a)=>`<q>${m[0]}${a}${m[m.length-1]}</q>`)}
let curScene=-1;
function show(ci){
  const c=D.cues[ci]; if(!c)return; const s=D.scenes[c.s];
  if(c.s!==curScene){
    curScene=c.s;
    Object.values(layers).forEach(l=>{l.classList.remove('on'); if(l.pause)l.pause();});
    const el=bgEl(s.bg); el.classList.add('on'); if(el.play)el.play().catch(()=>{});
    const st=document.getElementById('stage'); st.className='chip stage '+s.stage; st.textContent=STL[s.stage]||'';
    document.getElementById('stitle').textContent=s.title;
    document.getElementById('mlabel').textContent=D.meterLabel;
    document.getElementById('mbar').style.width=(METER[s.stage]||10)+'%';
  }
  const cap=document.getElementById('cap'); cap.innerHTML=fmtCap(c.text); if(D.lang==='en')cap.classList.add('en');
}
function fit(){
  if(document.body.classList.contains('render'))return;
  const sc=Math.min(window.innerWidth/D.W,(window.innerHeight-80)/D.H);
  wrap.style.transform=`scale(${sc})`; const h=document.getElementById('holder'); h.style.width=D.W*sc+'px'; h.style.height=D.H*sc+'px';
}
window.addEventListener('resize',fit);
// frame mode (renderer): #f=<cueIndex> or #thumb
function route(){
  const h=location.hash.slice(1);
  document.getElementById('thumb').classList.toggle('on',h==='thumb');
  if(h.startsWith('f='))show(+h.slice(2));
}
window.addEventListener('hashchange',route);
// player mode
const aud=document.getElementById('aud');
document.getElementById('play').onclick=()=>{document.body.classList.add('play');D.mode='play';
  if(aud.paused){aud.play();document.getElementById('play').textContent='❚❚ '+D.pauseLabel;}else{aud.pause();document.getElementById('play').textContent='▶ '+D.playLabel;}};
document.getElementById('speed').onchange=e=>aud.playbackRate=+e.target.value;
let last=-1;
aud.addEventListener('timeupdate',()=>{const t=aud.currentTime; let i=D.cues.findIndex(c=>t>=c.a&&t<c.b); if(i<0)return; if(i!==last){last=i;show(i);}
  const m=Math.floor(t/60),s=Math.floor(t%60); document.getElementById('clock').textContent=`${m}:${String(s).padStart(2,'0')}`;});
fit(); if(location.hash)route(); else {document.getElementById('thumb').classList.add('on'); aud.addEventListener('play',()=>document.getElementById('thumb').classList.remove('on'),{once:true});}
document.fonts && document.fonts.ready.then(()=>{document.body.dataset.ready=1});
</script>
</body>
</html>
